<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luxury Real Estate</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css" />
  
  <!-- GSAP & Lenis for Smooth Scroll/Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
</head>
<body>

  <!-- Loading Screen -->
  <div class="loader">
    <div class="loader-text">UNLOCKING EXCLUSIVITY</div>
  </div>

  <!-- Background Video for Apple-style Scrubbing -->
  <div class="video-container">
    <video id="bg-video" src="./assets/real_estate_bg.mp4" muted playsinline preload="auto"></video>
    <div class="overlay-gradient"></div>
  </div>

  <!-- Main Content container -->
  <main class="content">
    
    <!-- Hero Section -->
    <section class="section hero">
      <div class="glass-card main-glass">
        <h3 id="location" class="sub-heading">LOCATION</h3>
        <h1 id="hero-title" class="title">Exclusive Estates</h1>
        <p id="hero-subtitle" class="subtitle">Experience architectural mastery.</p>
        <button id="book-btn" class="cta-btn">Schedule a Private Viewing</button>
      </div>
    </section>

    <!-- Properties Showcase -->
    <section class="section showcase" id="properties-section">
      <!-- Injected via JS -->
    </section>

    <!-- Footer / Contact -->
    <section class="section contact">
      <div class="glass-card contact-card">
        <h2 id="company-name">Company Name</h2>
        <p>Your premier partner in luxury real estate.</p>
        <div class="badges">
          <span class="badge">Exclusive Listings</span>
          <span class="badge">Off-Market Access</span>
          <span class="badge">Global Network</span>
        </div>
      </div>
    </section>
  </main>

  <script src="./main.js"></script>
</body>
</html>
