<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Yachts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
</head>
<body>
  
  <!-- 3D Background Container -->
  <div class="video-container">
    <video id="hero-video" src="assets/hero-bg.mp4" muted playsinline preload="auto"></video>
  </div>

  <div class="content-overlay">
    <section class="section section-1">
      <h1 class="glass-text" id="hero-title">Redefining Luxury</h1>
      <p id="hero-subtitle">Experience the ocean like never before.</p>
    </section>
    
    <section class="section section-2">
      <h2 class="glass-text" id="service-1-title">Impeccable Design</h2>
      <p id="service-1-desc">Every curve crafted for elegance and speed.</p>
    </section>

    <section class="section section-3">
      <h2 class="glass-text" id="service-2-title">Unparalleled Comfort</h2>
      <p id="service-2-desc">Your sanctuary on the sea.</p>
    </section>

    <!-- Phase 3: Contact Form & Footer -->
    <section class="section contact-section">
      <div class="contact-card glass-text">
        <h2 id="contact-title">Inquire Now</h2>
        <p id="contact-subtitle">Take the first step towards owning your dream yacht.</p>
        <form class="contact-form">
          <input type="text" placeholder="Full Name" required />
          <input type="email" placeholder="Email Address" required />
          <textarea placeholder="Your Message" rows="4" required></textarea>
          <a id="contact-btn" href="#" target="_blank" style="display: block; text-align: center; text-decoration: none; padding: 1rem; background: #fff; color: #000; font-weight: 600; border-radius: 8px; text-transform: uppercase; letter-spacing: 2px;">Send Inquiry</a>
        </form>
      </div>
    </section>
  </div>

  <footer class="footer">
    <p>&copy; <span id="year">2026</span> <span id="footer-biz-name">Luxury Yachts</span>. All rights reserved.</p>
  </footer>

  <script src="./main.js"></script>
</body>
</html>
